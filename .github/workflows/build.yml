name: Build TinyPNG Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        if: always()
        shell: powershell
        run: |
          Write-Host "=== bundle directory ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName
          } else {
            Write-Host "bundle dir not found"
          }

      - name: Package portable zip
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Found installer: $($exe.FullName)"
            # Run installer silently to extract files
            $installDir = "portable-extract"
            Start-Process $exe.FullName -ArgumentList "/S /D=$((Resolve-Path .).Path)\$installDir" -Wait
            if (Test-Path $installDir) {
              Compress-Archive -Path "$installDir\*" -DestinationPath "TinyPNG-Desktop-portable.zip"
              Write-Host "Portable zip created"
            } else {
              Write-Host "Extraction failed, uploading installer instead"
              Copy-Item $exe.FullName "TinyPNG-Desktop-setup.exe"
            }
          }

      - name: Upload portable
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: windows-portable
          path: |
            TinyPNG-Desktop-portable.zip
            TinyPNG-Desktop-setup.exe
          if-no-files-found: warn
