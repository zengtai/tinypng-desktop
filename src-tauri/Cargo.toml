[package]
name = "tinypng-desktop"
version = "0.1.0"
description = "TinyPNG Desktop - Batch Image Compressor"
authors = ["you"]
edition = "2021"

[package.metadata.bundle]
name = "TinyPNG Desktop"
identifier = "com.tinypng-desktop.app"
icon = ["icons/icon.ico", "icons/128x128.png"]

[lib]
name = "tinypng_desktop_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tinypng-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
mime_guess = "2"
futures = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
